# CI: the Fragiola project jobs, with the Playwright suites split out of Checks.
#
#   Checks   Biome, TypeScript, the unit tests and the build (with the .d.ts check).
#   Package  `pnpm check:package`: builds and packs every package with pnpm, lints the tarballs
#            (dist-only exports, publint, attw), checks each adapter pins the core's exact
#            version, then installs each adapter into its own scratch app outside the workspace
#            (Vite + React, Vite + Vue, Vite + Angular) that typechecks, builds and loads its dev
#            server.
#   Changesets  on a pull request, `pnpm changeset status` fails when the PR changes what a
#            package ships (`changedFilePatterns` in .changeset/config.json) without adding a
#            changeset. Skipped for the Version Packages PR (changeset-release/*), which consumes
#            them.
#   Changes  the E2E suites the pull request can affect (scripts/e2e-suites.ts, a `git diff`
#            against the base; Epic #55, from fragiola/data-grid): none for docs only (site/docs,
#            *.md, AGENTS.md); packages/react or examples/react: the playground (with WebKit
#            mobile) and examples react; packages/vue or examples/vue: examples vue;
#            packages/angular or examples/angular: examples angular; anything else (the core,
#            examples/shared, the playground, the lockfile, root configs, .github, scripts, site)
#            and a manual run: every suite. It also lists the frameworks with an examples app
#            (every `examples/<framework>` with a playwright.config.ts: react, vue, angular).
#   E2E      the Playwright suites it selects, in parallel jobs, in Playwright's image
#            (mcr.microsoft.com/playwright, the tag of @playwright/test: no browser install;
#            Epic #55): the playground (Chromium and Firefox, and the `mobile` project: Chromium
#            on a phone, real touch input) from source, so its job builds nothing, and one job per
#            framework's examples app, each running the shared specs of examples/shared/e2e
#            against its own embed (Chromium). An examples embed builds against the packages'
#            dist, so its job builds the packages. No shards: each suite's tests take about 2
#            minutes or less.
#   E2E (WebKit mobile)  the playground's mobile specs in WebKit on an iPhone's viewport, in the
#            same image, whenever the playground suite runs: a report, never a gate
#            (continue-on-error), as WebKit in CI can be slow or flaky.
#   Site export       fragiola.com builds /grid-layout from `pnpm site:export` (contract v1.2,
#                     fragiola/www CONTRACT.md), built and validated the way www's deploy runs
#                     it: it fails on anything www would reject.
#   Trigger www build on a push to main, asks fragiola/www to rebuild fragiola.com (a
#                     repository_dispatch of type "project-updated"). It needs the
#                     WWW_DISPATCH_TOKEN secret: a fine-grained token with Contents: read &
#                     write on fragiola/www. Without the secret the step is skipped, not failed.
#
# Tests run only on pull requests (and on a manual run): with one coordinator merging one PR at a
# time, main is what its PR tested, and a push to main runs nothing but the www trigger.
# The same push also runs release.yml: the Version Packages PR, or the npm publish (whose pack
# job runs `scripts/check-package.ts --tarballs` on the very tarballs it publishes).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # a report, never a gate (Epic #62): the bundle sizes in the job summary
      - run: pnpm size

  package:
    name: Package
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # builds the packages first, then packs, lints and smoke-tests the tarballs
      - run: pnpm check:package

  changesets:
    name: Changesets
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--since` diffs from the merge base with the base branch: the full history is needed
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # the root's tools only (@changesets/cli): the check reads the packages' manifests and git
      - run: pnpm install --frozen-lockfile --filter "{.}"

      - name: A changeset for every package change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm changeset status --since="origin/$BASE_REF"

  changes:
    name: Changes
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      playground: ${{ steps.suites.outputs.playground }}
      examples: ${{ steps.suites.outputs.examples }}
    steps:
      # a pull request checks out its merge commit: its first parent is the base it merges into
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: suites
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            node scripts/e2e-suites.ts --diff HEAD^1
          else
            node scripts/e2e-suites.ts --all
          fi

  # The E2E jobs run in Playwright's image, whose browsers and system libraries match
  # @playwright/test (its tag follows the version; site/tests/ci-workflow.test.ts checks it), so
  # they install nothing.
  e2e:
    name: E2E (playground)
    needs: changes
    if: needs.changes.outputs.playground == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Playwright
        run: pnpm --filter playground run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-playground
          path: apps/playground/playwright-report/
          retention-days: 14

  e2e-examples:
    name: E2E (examples ${{ matrix.framework }})
    needs: changes
    if: needs.changes.outputs.examples != '[]' && needs.changes.outputs.examples != ''
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJson(needs.changes.outputs.examples) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The examples suite builds the embed against the packages' dist (examplesE2eConfig).
      - name: Build the packages
        run: pnpm --filter "./packages/*" build

      - name: Run Playwright
        run: pnpm --filter examples-${{ matrix.framework }} run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-examples-${{ matrix.framework }}
          path: examples/${{ matrix.framework }}/playwright-report/
          retention-days: 14

  e2e-webkit:
    name: E2E (WebKit mobile)
    needs: changes
    if: needs.changes.outputs.playground == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    # a report, never a gate (Epic #13): WebKit in CI can be slow or flaky
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the mobile specs in WebKit
        working-directory: apps/playground
        env:
          PLAYWRIGHT_WEBKIT: "1"
        run: pnpm exec playwright test --project webkit-mobile

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-webkit-mobile
          path: apps/playground/playwright-report/
          retention-days: 14

  site-export:
    name: Site export
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm site:export --base /grid-layout --out "$RUNNER_TEMP/site-export"

  trigger-www-build:
    name: Trigger www build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      WWW_DISPATCH_TOKEN: ${{ secrets.WWW_DISPATCH_TOKEN }}
    steps:
      - name: Dispatch project-updated to fragiola/www
        if: env.WWW_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.WWW_DISPATCH_TOKEN }}
        run: |
          gh api repos/fragiola/www/dispatches \
            -f event_type=project-updated \
            -f "client_payload[slug]=grid-layout" \
            -f "client_payload[sha]=$GITHUB_SHA"
